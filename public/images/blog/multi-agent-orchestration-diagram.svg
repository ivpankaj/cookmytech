<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0a0a0a; font-family:monospace;">
  <defs>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <rect width="100%" height="100%" fill="url(#grid4)" />

  <rect x="60" y="40" width="1080" height="70" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
  <text x="90" y="82" fill="#ec4899" font-size="22" font-weight="bold">MULTI-AGENT SUPERVISOR &amp; DELEGATION SWARM</text>
  <text x="920" y="82" fill="#10b981" font-size="15" font-weight="bold">[SWARM ARCHITECTURE]</text>

  <!-- Top Supervisor Node -->
  <rect x="420" y="140" width="360" height="100" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <text x="440" y="175" fill="#ec4899" font-size="16" font-weight="bold">SUPERVISOR / ROUTER AGENT</text>
  <text x="440" y="205" fill="#cbd5e1" font-size="13">• Task breakdown &amp; sub-goal assignment</text>

  <!-- Sub Agent 1 -->
  <rect x="60" y="300" width="320" height="150" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="2" />
  <text x="80" y="335" fill="#3b82f6" font-size="15" font-weight="bold">RESEARCH &amp; SCRAPING AGENT</text>
  <text x="80" y="365" fill="#cbd5e1" font-size="13">• Web crawling &amp; PDF extraction</text>
  <text x="80" y="390" fill="#cbd5e1" font-size="13">• Vector DB semantic store</text>

  <!-- Sub Agent 2 -->
  <rect x="440" y="300" width="320" height="150" rx="8" fill="#111827" stroke="#a855f7" stroke-width="2" />
  <text x="460" y="335" fill="#a855f7" font-size="15" font-weight="bold">CODE &amp; REFACTOR AGENT</text>
  <text x="460" y="365" fill="#cbd5e1" font-size="13">• AST Code parsing &amp; diff creation</text>
  <text x="460" y="390" fill="#cbd5e1" font-size="13">• TypeScript / Python compilers</text>

  <!-- Sub Agent 3 -->
  <rect x="820" y="300" width="320" height="150" rx="8" fill="#111827" stroke="#10b981" stroke-width="2" />
  <text x="840" y="335" fill="#10b981" font-size="15" font-weight="bold">QA &amp; VERIFICATION AGENT</text>
  <text x="840" y="365" fill="#cbd5e1" font-size="13">• Unit test runner &amp; linter</text>
  <text x="840" y="390" fill="#cbd5e1" font-size="13">• Security vulnerability audit</text>

  <!-- Connecting Lines -->
  <path d="M 600 240 L 220 300" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" />
  <path d="M 600 240 L 600 300" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" />
  <path d="M 600 240 L 980 300" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />

  <!-- Shared Memory Footer -->
  <rect x="60" y="490" width="1080" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="90" y="528" fill="#38bdf8" font-size="15" font-weight="bold">SHARED CONVERSATION &amp; VECTOR MEMORY STATE:</text>
  <text x="90" y="555" fill="#e2e8f0" font-size="13">All sub-agents communicate asynchronously via JSON-L step trajectories and Redis pub/sub channels for zero race conditions.</text>
</svg>
