<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#090d16; font-family:monospace;">
  <defs>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#090d16"/>
  <rect width="100%" height="100%" fill="url(#grid3)" />

  <rect x="60" y="40" width="1080" height="70" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
  <text x="90" y="82" fill="#60a5fa" font-size="22" font-weight="bold">AUTONOMOUS AI AGENT STATE MACHINE &amp; REACT LOOP</text>
  <text x="920" y="82" fill="#a855f7" font-size="15" font-weight="bold">[LANGGRAPH SYSTEM]</text>

  <!-- Node 1: User Prompt -->
  <rect x="60" y="170" width="220" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="80" y="205" fill="#60a5fa" font-size="14" font-weight="bold">1. USER INPUT / INTENT</text>
  <text x="80" y="240" fill="#cbd5e1" font-size="13">• System Prompt inject</text>
  <text x="80" y="265" fill="#cbd5e1" font-size="13">• Conversation state</text>
  <text x="80" y="290" fill="#cbd5e1" font-size="13">• Vector Memory recall</text>
  <text x="80" y="315" fill="#cbd5e1" font-size="13">• Token limit check</text>

  <!-- Node 2: LLM Planning -->
  <rect x="340" y="170" width="240" height="190" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
  <text x="360" y="205" fill="#c084fc" font-size="14" font-weight="bold">2. LLM REASONING &amp; PLAN</text>
  <text x="360" y="240" fill="#cbd5e1" font-size="13">• Chain-of-Thought (CoT)</text>
  <text x="360" y="265" fill="#cbd5e1" font-size="13">• Structured Tool Selection</text>
  <text x="360" y="290" fill="#cbd5e1" font-size="13">• Schema validation</text>
  <text x="360" y="315" fill="#cbd5e1" font-size="13">• Confidence scoring</text>

  <!-- Node 3: Tool Execution -->
  <rect x="630" y="170" width="240" height="190" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="650" y="205" fill="#fbbf24" font-size="14" font-weight="bold">3. TOOL CALL &amp; API EXEC</text>
  <text x="650" y="240" fill="#cbd5e1" font-size="13">• Python / DB Execution</text>
  <text x="650" y="265" fill="#cbd5e1" font-size="13">• Web Search / Browser</text>
  <text x="650" y="290" fill="#cbd5e1" font-size="13">• Sandbox isolation</text>
  <text x="650" y="315" fill="#cbd5e1" font-size="13">• Error self-healing</text>

  <!-- Node 4: Evaluation -->
  <rect x="920" y="170" width="220" height="190" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="940" y="205" fill="#34d399" font-size="14" font-weight="bold">4. OUTPUT VERIFIER</text>
  <text x="940" y="240" fill="#cbd5e1" font-size="13">• Reflection Agent</text>
  <text x="940" y="265" fill="#cbd5e1" font-size="13">• Hallucination check</text>
  <text x="940" y="290" fill="#cbd5e1" font-size="13">• Goal complete?</text>
  <text x="940" y="315" fill="#cbd5e1" font-size="13">• Final user response</text>

  <!-- Bottom Feedback Loop -->
  <rect x="60" y="400" width="1080" height="170" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
  <text x="90" y="440" fill="#38bdf8" font-size="16" font-weight="bold">SELF-CORRECTION LOOP (RETRIES &amp; FALLBACKS):</text>
  <text x="90" y="475" fill="#94a3b8" font-size="13">If Tool Execution returns exception or schema validation fails $\rightarrow$ Agent automatically rewrites function arguments and retries up to 3 times before raising a controlled fallback.</text>
  <text x="90" y="515" fill="#10b981" font-size="13">Guaranteed Reliability: 99.4% task completion rate on complex multi-step web scraping, code generation, and financial analysis.</text>
</svg>
