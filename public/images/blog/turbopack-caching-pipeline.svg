<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#090d16; font-family:monospace;">
  <defs>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#111827" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#090d16"/>
  <rect width="100%" height="100%" fill="url(#grid2)" />

  <rect x="50" y="40" width="1100" height="70" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
  <text x="80" y="82" fill="#38bdf8" font-size="22" font-weight="bold">MULTI-TIER CACHING &amp; CDN DISTRIBUTION IN NEXT.JS 16</text>
  <text x="940" y="82" fill="#f59e0b" font-size="15" font-weight="bold">[EDGE PLATFORM]</text>

  <!-- Cache Layers -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="1080" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="30" y="38" fill="#38bdf8" font-size="16" font-weight="bold">LAYER 1: ROUTER CACHE (IN-MEMORY BROWSER)</text>
    <text x="30" y="65" fill="#94a3b8" font-size="13">Stores RSC payloads in the client browser during navigation • Zero network calls for visited pages</text>
  </g>

  <g transform="translate(60, 260)">
    <rect x="0" y="0" width="1080" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <text x="30" y="38" fill="#a855f7" font-size="16" font-weight="bold">LAYER 2: FULL ROUTE CACHE &amp; DATA CACHE (SERVER)</text>
    <text x="30" y="65" fill="#94a3b8" font-size="13">Per-fetch data caching with tag-based revalidation (`revalidateTag()`) • Automatic stale-while-revalidate</text>
  </g>

  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="1080" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="30" y="38" fill="#10b981" font-size="16" font-weight="bold">LAYER 3: EDGE CDN &amp; GLOBAL DISTRIBUTED CACHE</text>
    <text x="30" y="65" fill="#94a3b8" font-size="13">Cloudflare / Vercel Edge caching • Static assets, OG images, and compiled Turbopack chunks served globally in &lt;15ms</text>
  </g>

  <rect x="60" y="490" width="1080" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="90" y="528" fill="#f87171" font-size="15" font-weight="bold">PRO-TIP FOR ENTERPRISE SCALING:</text>
  <text x="90" y="555" fill="#e2e8f0" font-size="13">Always pair `useMemo` &amp; server caching with Redis/Upstash vector caching for high-concurrency LLM responses.</text>
</svg>
