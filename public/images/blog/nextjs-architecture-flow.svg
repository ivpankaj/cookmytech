<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0a0a0a; font-family:monospace;">
  <!-- Grid Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Banner -->
  <rect x="60" y="40" width="1080" height="70" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
  <text x="90" y="82" fill="#ffffff" font-size="24" font-weight="bold" letter-spacing="2">NEXT.JS 16 APP ROUTER &amp; TURBOPACK PIPELINE</text>
  <text x="900" y="82" fill="#10b981" font-size="16" font-weight="bold">[PRODUCTION ARCHITECTURE]</text>

  <!-- Flow Boxes -->
  <!-- Step 1: User Request -->
  <rect x="60" y="160" width="230" height="180" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-width="2" />
  <text x="80" y="195" fill="#3b82f6" font-size="14" font-weight="bold">01. INCOMING REQUEST</text>
  <text x="80" y="230" fill="#e5e7eb" font-size="13">• HTTP/2 &amp; HTTP/3</text>
  <text x="80" y="255" fill="#e5e7eb" font-size="13">• Edge Middleware</text>
  <text x="80" y="280" fill="#e5e7eb" font-size="13">• Auth &amp; Bot Inspection</text>
  <text x="80" y="305" fill="#e5e7eb" font-size="13">• Sub-10ms TTFB</text>

  <!-- Step 2: Turbopack Compilation -->
  <rect x="340" y="160" width="240" height="180" rx="8" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" />
  <text x="360" y="195" fill="#a855f7" font-size="14" font-weight="bold">02. TURBOPACK ENGINE</text>
  <text x="360" y="230" fill="#e5e7eb" font-size="13">• Rust-based bundler</text>
  <text x="360" y="255" fill="#e5e7eb" font-size="13">• Incremental Graphs</text>
  <text x="360" y="280" fill="#e5e7eb" font-size="13">• Tree-shaken modules</text>
  <text x="360" y="305" fill="#e5e7eb" font-size="13">• Zero-lag HMR</text>

  <!-- Step 3: Partial Prerendering (PPR) -->
  <rect x="630" y="160" width="240" height="180" rx="8" fill="#1f2937" stroke="#ec4899" stroke-width="2" />
  <text x="650" y="195" fill="#ec4899" font-size="14" font-weight="bold">03. PPR &amp; HYDRATION</text>
  <text x="650" y="230" fill="#e5e7eb" font-size="13">• Static Shell stream</text>
  <text x="650" y="255" fill="#e5e7eb" font-size="13">• Suspense boundaries</text>
  <text x="650" y="280" fill="#e5e7eb" font-size="13">• React Server Components</text>
  <text x="650" y="305" fill="#e5e7eb" font-size="13">• Selective Client hydration</text>

  <!-- Step 4: CDN Edge Response -->
  <rect x="910" y="160" width="230" height="180" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="2" />
  <text x="930" y="195" fill="#10b981" font-size="14" font-weight="bold">04. CLIENT DELIVERY</text>
  <text x="930" y="230" fill="#e5e7eb" font-size="13">• Instant FCP (Fast)</text>
  <text x="930" y="255" fill="#e5e7eb" font-size="13">• 0ms Cumulative Shift</text>
  <text x="930" y="280" fill="#e5e7eb" font-size="13">• 100/100 Lighthouse</text>
  <text x="930" y="305" fill="#e5e7eb" font-size="13">• SEO Optimized</text>

  <!-- Lower Section: Performance Metrics Bar -->
  <rect x="60" y="380" width="1080" height="190" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />
  <text x="90" y="420" fill="#ffffff" font-size="18" font-weight="bold">KEY BENCHMARK COMPARISON (NEXT.JS 16 VS WEBPACK TRADITIONAL)</text>
  
  <text x="90" y="465" fill="#9ca3af" font-size="13">Build Speed (Cold Start):</text>
  <rect x="300" y="450" width="700" height="20" rx="4" fill="#374151" />
  <rect x="300" y="450" width="620" height="20" rx="4" fill="#10b981" />
  <text x="930" y="465" fill="#ffffff" font-size="12" font-weight="bold">Turbopack: 1.2s</text>

  <text x="90" y="515" fill="#9ca3af" font-size="13">Server-Side Latency (TTFB):</text>
  <rect x="300" y="500" width="700" height="20" rx="4" fill="#374151" />
  <rect x="300" y="500" width="670" height="20" rx="4" fill="#3b82f6" />
  <text x="980" y="515" fill="#ffffff" font-size="12" font-weight="bold">Edge SSR: 14ms</text>
</svg>
